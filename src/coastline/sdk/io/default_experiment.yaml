# Built-in recommendation policy, used by the CLI, the Python API and the UI when no config file
# is found. It ships in the wheel. The editable copy is config/coastline_functionality/experiment.yaml,
# which may also hold a `workload:` block for `recommend-job --config`; this file has the policy
# only. Keep the two in sync.
strategy:
  name: "multi_objective"
  preset: "balanced"

predictors:
  performance: "intelligent"
  energy: "kavier_power"
  feasibility: "autoconf"

grid:
  batch_sizes: [4, 8, 16, 32, 64]
  total_gpus: [1, 2, 4, 8, 16, 32]
  top_k: 5

# Settings for the machine Coastline runs on (the cluster is described in infrastructure.yaml).
# Each pipeline stage splits its candidates across this many processes; 1 runs in one process.
runtime:
  parallel_workers: 4
