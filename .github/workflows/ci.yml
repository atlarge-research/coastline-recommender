name: CI

# Pull requests only: a plain push (any branch or tag) runs nothing. Release tags still pass the
# full suite through release.yml's gate; workflow_dispatch runs it by hand on any branch.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:   # reused by release.yml as the pre-publish gate

# Every job is capped at 10 min (normal runs take under 6). GitHub's default is 360: on 2026-09-16 a
# hung macOS test job (in Kavier) ran the full 6 h.
jobs:
  # 3. Lint (ruff) + strict mypy on the gated packages.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (runtime + dev group)
        run: uv sync --python 3.13
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      # Hook environments are cloned from GitHub on first use; cache them per config file.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # The same hooks contributors get locally (`uv run pre-commit install`), so the config cannot
      # rot: ruff --fix and ruff-format re-check what the two steps above check, and the whitespace
      # hooks are what CI adds on top.
      - name: Pre-commit (all files)
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Mypy (strict — gated packages)
        run: uv run mypy

  # 2. Tests (uv). The full suite needs the ml + autoconf extras (they resolve on 3.13); once synced
  #    with --all-extras, every `uv run` uses --no-sync so it does not drop the extras.
  #    Linux only. Coastline is POSIX-first (the interactive REPL drives the terminal via termios);
  #    macOS is covered by local development — it is what the authors work on — not by CI, where
  #    its minutes cost ~10x.
  test:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # tokenless (OIDC) Codecov upload — see the upload step below
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync (dev + all runtime extras)
        # --all-extras: every [ml] backend (torch, tabpfn, catboost, xgboost, lightgbm) and the
        # autogluon tree ado-autoconf pulls.
        run: uv sync --python 3.13 --all-extras
      - name: CLI smoke (entry points resolve)
        run: |
          uv run --no-sync coastline --help
          uv run --no-sync coastline recommend-job --help
          uv run --no-sync coastline recommend-trace --help
          uv run --no-sync coastline simulate --help
          uv run --no-sync coastline explain --help
          uv run --no-sync coastline utils --help
          uv run --no-sync coastline utils plot-trace --help
          uv run --no-sync python -m coastline.cli --help
          uv run --no-sync python -c "from coastline.ui import main; assert callable(main)"
          uv run --no-sync python -c "from coastline.ui.app import app"
          uv run --no-sync python -c "import sys, coastline; assert callable(coastline); assert not any(m in sys.modules for m in ('torch','xgboost'))"
      - name: Run pytest (shipped-package suite)
        # CI validates the shipped package. The dev trainer/benchmark tests require the external
        # trace-archive dataset (not available in CI); run them locally, each in its own invocation:
        # `uv run --all-extras pytest dev/trainer/tests` / `... dev/benchmark/tests`.
        run: uv run --no-sync pytest --cov=coastline --cov-report=xml
      - name: Run pytest (ado experiment plugin)
        # The plugin is not in `testpaths`, so name its suite explicitly. It runs in the ROOT
        # environment on purpose: ado-core is already here transitively via ado-autoconf, and a
        # separate `--project dev/ado_plugin` resolution would look for coastline-recommender on
        # PyPI (not published) without the root's pyarrow override.
        run: uv run --no-sync pytest dev/ado_plugin/ado_coastline/test
      - name: Native-ML predictor tests (informational — featv3 pickles may need regen on 3.13)
        # Linux only: this leg is already informational (continue-on-error), and the libomp-bundling
        # backends it co-loads are the reason the marker exists — one platform's signal is enough.
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: uv run --no-sync pytest -m ml_isolated -p no:cacheprovider

      # Tokenless upload via OIDC (needs this job's `id-token: write` above), so no CODECOV_TOKEN
      # secret is required for pushes from this repo. Coverage is a signal, not a gate: a Codecov
      # outage or a fork PR (no OIDC) must never fail an otherwise-green run.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: coverage.xml
          flags: ${{ matrix.os }}
          fail_ci_if_error: false

  # 1. Build the wheel and prove it ships whole: install into a fresh venv (no repo on the
  #    path) and smoke every console script + packaged data.
  wheel-smoke:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Install the wheel into a fresh venv and smoke it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          mkdir -p "$RUNNER_TEMP/wheel-smoke" && cd "$RUNNER_TEMP/wheel-smoke"
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          coastline --help
          python -m coastline.cli --help
          python -c "from coastline.ui import main; assert callable(main)"
          # Packaged data + templates must ship in the wheel.
          python -c "from coastline.sdk.io.sample_data import sample_raw_trace_path; assert sample_raw_trace_path().exists()"
          python -c "import importlib.resources as r; assert (r.files('coastline.ui') / 'templates' / 'index.html').is_file()"

  # 4. Build the CLI + UI docker images (build only on CI; push happens in release.yml).
  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        target: [cli, ui]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: coastline:${{ matrix.target }}

  # The documentation site must build strictly (no broken links).
  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build docs (strict)
        run: |
          uv sync --only-group docs --no-install-project
          uv run --no-sync mkdocs build --strict
