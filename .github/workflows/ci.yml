name: CI

# Runs on pull requests, by hand, and from release.yml. Pushes alone run nothing.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:  # release.yml pre-publish gate

permissions:
  contents: read

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job has a timeout (GitHub's default is 360 min).
# Longest release.yml chain: guard 1 + lint 4 + test 5 + build 2 + github-release 2 = 14 min.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --locked --python 3.13

      # Hook environments are cloned on first use; cache them per config file.
      - name: Cache pre-commit hook environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # ruff check, ruff format, and whitespace checks (.pre-commit-config.yaml).
      - name: Pre-commit (all files)
        run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure

      # Strict mypy on the packages listed in pyproject.toml.
      - name: Mypy
        run: uv run --no-sync mypy

  test:
    needs: lint
    # Linux only; macOS is the development platform.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --all-extras: the [ml] backends and [plot]. Later steps use --no-sync to keep them.
      - name: Sync
        run: uv sync --locked --python ${{ matrix.python-version }} --all-extras

      - name: CLI smoke (entry points resolve)
        run: |
          uv run --no-sync coastline --help
          uv run --no-sync coastline recommend-job --help
          uv run --no-sync coastline recommend-trace --help
          uv run --no-sync coastline simulate --help
          uv run --no-sync coastline explain --help
          uv run --no-sync coastline utils --help
          uv run --no-sync coastline utils plot-trace --help
          uv run --no-sync python -m coastline.cli --help
          uv run --no-sync python -c "from coastline.ui import main; assert callable(main)"
          uv run --no-sync python -c "from coastline.ui.app import app"
          # `import coastline` loads no ML backend.
          uv run --no-sync python -c "import sys, coastline; assert callable(coastline); assert not any(m in sys.modules for m in ('torch','xgboost'))"

      # dev/trainer/tests and dev/benchmark/tests need the trace archive, which CI does not have.
      - name: Run pytest
        run: uv run --no-sync pytest --cov

      # Tests that load native ML backends, one file per process (co-loaded backends can crash).
      - name: Run pytest (ml_isolated)
        run: |
          files=$(uv run --no-sync pytest -m ml_isolated -p no:cacheprovider --collect-only | grep '::' | cut -d: -f1 | sort -u)
          for f in $files; do uv run --no-sync pytest -m ml_isolated -p no:cacheprovider "$f"; done

  # Install the built wheel into a fresh venv and smoke the console scripts and packaged data.
  wheel-smoke:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build sdist + wheel
        run: uv build

      - name: Install wheel into a fresh venv and smoke it
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv" --python 3.13
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" dist/*.whl
          # Run from an empty dir so nothing can be imported from the repo checkout.
          mkdir -p "$RUNNER_TEMP/wheel-smoke"
          cd "$RUNNER_TEMP/wheel-smoke"
          export PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH"
          coastline --help
          python -m coastline.cli --help
          python -c "from coastline.ui import main; assert callable(main)"
          python -c "from coastline.sdk.io.sample_data import sample_raw_trace_path; assert sample_raw_trace_path().exists()"
          python -c "import importlib.resources as r; assert (r.files('coastline.ui') / 'templates' / 'index.html').is_file()"

  # Build both Dockerfile targets so a broken image fails the pull request.
  docker-build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        target: [cli, ui]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          tags: coastline:${{ matrix.target }}

  # The same strict build as docs-deploy.yml, so broken docs fail the pull request.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build docs (strict)
        run: |
          uv sync --locked --only-group docs --no-install-project
          uv run --no-sync mkdocs build --strict
