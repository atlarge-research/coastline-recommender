name: Release

# Release: `uv version --bump patch` (or minor), set the same version in CITATION.cff and .zenodo.json,
# commit, `git tag vX.Y.Z`, `git push --tags`.
#   guard (tag == versions) -> gates (ci.yml) -> build -> PyPI and GitHub release in parallel.
# The GitHub release triggers the Zenodo archive.
# Filter patterns match the full ref, so `v0.2.3` triggers a release and `v0.2.2-thesis`,
# `v0.2.3rc1`, and `v0.2.2.1` do not.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Jobs below add the permissions they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # The tag must match the version in pyproject.toml, CITATION.cff and .zenodo.json.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7
      - name: Tag must equal the package and citation versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          CFF="$(sed -n 's/^version: *//p' CITATION.cff)"
          ZENODO="$(python3 -c "import json; print(json.load(open('.zenodo.json'))['version'])")"
          echo "tag=$TAG pyproject=$PYPROJECT CITATION.cff=$CFF .zenodo.json=$ZENODO"
          for v in "$PYPROJECT" "$CFF" "$ZENODO"; do
            [ "$v" = "$TAG" ] || { echo "::error::tag v$TAG does not match version $v"; exit 1; }
          done

  # The full CI suite (lint, mypy, tests, wheel smoke, docker build, docs) gates publishing.
  gates:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # PyPI and the GitHub release publish this one build.
  build:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # PyPI Trusted Publishing (OIDC): configured for this repo with workflow `release.yml` and no environment.
    permissions:
      id-token: write  # Trusted Publishing token and attestation signing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Uploads PEP 740 attestations (Sigstore) by default under Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1

  # Independent of the PyPI job, so the Zenodo archive does not depend on it.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
