# Weekly updates for two ecosystems, grouped into one PR each.
version: 2
updates:
  # Action versions in .github/workflows/; Dependabot finds them from "/".
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # pyproject.toml + uv.lock, including PEP 735 groups, so dev bumps are kept apart from runtime ones.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Runtime bumps get their own PR: they change what users install.
      production-dependencies:
        dependency-type: "production"
        patterns: ["*"]
      # ruff/mypy/pytest change weekly; one PR for all of them.
      development-dependencies:
        dependency-type: "development"
        patterns: ["*"]
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
