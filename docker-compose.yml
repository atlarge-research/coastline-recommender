name: coastline

# The `cli` and `ui` targets of the Dockerfile.
#     docker compose run --rm recommender recommend-job --config /config/coastline_functionality/experiment.yaml
#     docker compose up api            # dashboard on :8000
#
# config/, ./models and the trace archive are not in the wheel, so they are mounted. Both services
# read the mounted experiment.yaml and infrastructure.yaml. ./models is writable for the recommender,
# where `coastline utils tune` saves into /models/custom; everything else is read-only. The image runs
# as uid 1000, so ./models must be writable by uid 1000 for `utils tune` (on Linux, for example
# `mkdir -p models && sudo chown -R 1000 models`; Docker creates a missing ./models owned by root).

services:
  recommender:
    build:
      context: .
      dockerfile: Dockerfile
      target: cli
    image: coastline-recommender:cli
    environment:
      - DATA_DIR=/trace-archive
      - OUTPUT_DIR=/runs
      - EXPERIMENT_CONFIG=/config/coastline_functionality/experiment.yaml
      - INFRASTRUCTURE_CONFIG=/config/coastline_functionality/infrastructure.yaml
      # The wheel ships five model pickles; ./models adds the others (tabpfn, random_forest, ...).
      - PORTFOLIO_DIR=/models
      # Use the rules feasibility check when AutoConf is not installed (no OOM check).
      - COASTLINE_ALLOW_RULES_FALLBACK=1
    volumes:
      - ./config:/config:ro
      - ./recommender/runs:/runs
      - ./models:/models
      - ../trace-archive:/trace-archive:ro
    command: ["recommend-job", "--config", "/config/coastline_functionality/experiment.yaml"]

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    image: coastline-recommender:ui
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATA_DIR=/trace-archive
      - EXPERIMENT_CONFIG=/config/coastline_functionality/experiment.yaml
      - INFRASTRUCTURE_CONFIG=/config/coastline_functionality/infrastructure.yaml
      - PORTFOLIO_DIR=/models
      - COASTLINE_ALLOW_RULES_FALLBACK=1
    volumes:
      - ./config:/config:ro
      - ./models:/models:ro
      - ../trace-archive:/trace-archive:ro
