# Annotated example config with the main keys and their allowed values. Changing a value
# changes the recommendations; it cannot break the API. For a short everyday config see
# config/coastline_functionality/experiment.yaml. Some keys exclude each other (pick one) and
# some are legacy (marked). The CLI reads workload.*, system.default_gpu, grid.*, strategy.*
# and predictors.*.


# Workload: the fine-tuning job. The grid sweeps batch_size and total_gpus, so the values
# here are the starting point. cli/run.py reads this block.
workload:
  # Model to fine-tune. It must be in Kavier's LLM_SPEC_LIBRARY or in the ML predictors' training data.
  llm_model: "mistral-7b-v0.1"
  # Fine-tuning method: full, lora or gptq-lora.
  fine_tuning_method: "lora"
  # Sequence length in tokens, any int > 0. WT1 values: 512, 1024, 2048, 4096, 8192.
  tokens_per_sample: 2048
  # Per-device batch size. The grid sweep replaces it; min_gpu keeps the total batch,
  # batch_size x gpus_per_node x number_of_nodes.
  batch_size: 8
  # GPU the job runs on. The CLI takes it first, then grid.gpu_models[0], then system.default_gpu.
  # gpu_model: "NVIDIA-A100-SXM4-80GB"
  # The job's node layout (1 GPU when unset). The grid derives its layouts from total_gpus.
  gpus_per_node: 8
  number_of_nodes: 1
  # Optional ML features. They are not swept, and the CLI ignores them.
  torch_dtype: "bfloat16"   # bfloat16 | float16
  enable_roce: true         # bool or null


# System: the infrastructure. The CLI reads only default_gpu, the job's GPU when neither
# workload.gpu_model nor grid.gpu_models names one. The other keys are descriptive (API or legacy).
system:
  default_gpu: "NVIDIA-A100-SXM4-80GB"
  max_tokens: 2048
  available_gpu_models:
    - "NVIDIA-A100-SXM4-80GB"
    - "NVIDIA-A100-80GB-PCIe"
    - "L40S"
    - "NVIDIA-H100-PCIe"
  max_gpus: 32
  gpu_memory:
    "NVIDIA-A100-SXM4-80GB": 80
    "NVIDIA-A100-80GB-PCIe": 80
    "NVIDIA-H100-PCIe": 80
    "L40S": 48
  constraints:
    max_gpus: 32
    gpus_per_node: 8
    max_nodes: 4


# Orchestration: legacy block that the CLI does not read.
orchestration:
  max_iterations: 3
  convergence_threshold: 0.05
  enable_verification: true
  fallback_on_failure: false


# Strategy: how candidates are ranked. PolicyFactory.create_strategy reads this block.
strategy:
  # min_gpu (the first feasible GPU count in 1, 2, 4, ... for the job's total batch; it uses no
  # grid) or multi_objective (alpha x runtime score + beta x energy score).
  name: "multi_objective"
  # For multi_objective: performance (alpha 0.8, beta 0.2; the default), balanced (0.5, 0.5) or
  # energy (0.2, 0.8; also energy-saver). Or set alpha and beta, which override the preset.
  preset: "performance"
  # alpha: 0.7  # runtime (performance) weight; beta: 0.3 energy weight (divided by their sum)


# Predictors for throughput, energy and feasibility, built by PolicyFactory.
predictors:
  # Throughput: intelligent (cache, then Kavier), kavier, cache, or an ML model name.
  performance: "intelligent"
  # Energy: kavier_power (default).
  energy: "kavier_power"
  # Feasibility: autoconf (OOM-aware, an ado plugin), rules, or none.
  feasibility: "autoconf"
  # AutoConf model version (default 3.1.0).
  autoconf_model_version: "3.1.0"


# Grid: the search space, batch_size x total_gpus. The node layout follows from total_gpus.
# GridConfig holds batch_sizes, total_gpus and top_k; min_gpu reads only top_k.
grid:
  # The job runs on workload.gpu_model, or on gpu_models[0] when that is unset.
  # Calibrated on WT1: NVIDIA-A100-SXM4-80GB, NVIDIA-A100-80GB-PCIe, L40S, NVIDIA-H100-PCIe.
  gpu_models:
    - "NVIDIA-A100-SXM4-80GB"
  batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128]
  # Total GPU counts to sweep; counts above the cluster's GPUs are skipped.
  total_gpus: [1, 2, 4, 8, 16, 32]
  # Number of ranked configs returned (unset: 5, and 1 for min_gpu).
  top_k: 3


# Output: legacy block that the CLI does not read. recommend-job prints the recommendation
# JSON, or writes recommendation.json to --output-dir.
output:
  format: "console"
  save_json: true
  json_path: "output/recommendation.json"
  save_html: false
  html_path: "output/recommendation.html"
  verbose: true
