# Cluster limits. The CLI and the dashboard keep every recommendation within them, so a wrong
# value changes which configurations are allowed.

total_gpus: 32                # cluster-wide GPU budget
max_nodes: 4                  # maximum number of nodes
max_gpus_per_node: 8          # maximum GPUs per node

# GPU types in the cluster. The dashboard shows how many there are and /api/infrastructure lists them.
gpu_models:
  - NVIDIA-A100-SXM4-80GB
