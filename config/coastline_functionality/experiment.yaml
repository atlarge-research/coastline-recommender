# Default recommendation policy, used when no other config is given (CLI, dashboard and
# PolicyFactory). It sets the strategy, predictors and grid; the cluster limits are in
# infrastructure.yaml.

# The job that `coastline recommend-job` runs. Omit it for a policy-only config; batch, trace
# and dashboard runs supply their own workloads.
workload:
  llm_model: "granite-3.1-3b-a800m-instruct"
  fine_tuning_method: "lora"
  gpu_model: "NVIDIA-A100-SXM4-80GB"
  tokens_per_sample: 2048
  batch_size: 8

# Ranking: multi_objective with the balanced preset (the default), or min_gpu.
strategy:
  name: "multi_objective"
  preset: "balanced"

# The models for throughput, energy and feasibility.
predictors:
  performance: "intelligent"   # exact cache hit, else the `fallback` model; or kavier, cache, or an ML model name
  fallback: "kavier"           # model used on a cache miss (kavier | catboost | xgboost | ...); intelligent only
  energy: "kavier_power"
  feasibility: "autoconf"      # OOM-aware; or rules (sanity checks only, no OOM check)
  # lookup: "default"                                 # cache DB CSV: a path, or "default" for the bundled run DB
  # lookup_throughput_col: "dataset_tokens_per_second"  # which column a cache hit reads as throughput
  # lookup_runtime_col: "train_runtime"                 # which column a cache hit reads as duration

# The search space swept per workload.
grid:
  batch_sizes: [4, 8, 16, 32, 64]
  total_gpus: [1, 2, 4, 8, 16, 32]
  top_k: 3

# The machine Coastline runs on (the cluster is described in infrastructure.yaml). A pipeline
# stage may split its candidates across up to parallel_workers processes, and the next stage
# starts when they all finish; 1 runs everything in one process.
runtime:
  parallel_workers: 4
