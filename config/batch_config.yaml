# Batch recommendation config: one recommendation for each row of an input CSV, written to an
# output CSV.
#
#   coastline recommend-job --config config/batch_config.yaml \
#       --input config/coastline_functionality/sample_workloads.csv --output recommendations.csv
#
# From Python: coastline.recommend_csv(config, input_csv, output_csv)

strategy:
  name: multi_objective    # ranking policy; or min_gpu (first feasible GPU count in 1, 2, 4, ...
                           # for the row's total batch, without the grid)
  preset: performance      # alpha (runtime) 0.8, beta (energy) 0.2; or balanced (0.5, 0.5),
                           # energy or energy-saver (0.2, 0.8)
  max_slowdown: 2.0        # drop configs more than 2x slower than the fastest feasible one;
                           # omit for no limit. min_gpu ignores it.

predictors:
  performance: kavier      # analytical model; or tabpfn, catboost, ... (need the [ml] extra)
  energy: kavier_power
  feasibility: rules       # sanity checks only, no OOM check, which keeps this example cheap.
                           # The default is autoconf (OOM-aware, part of the core install).

grid:                      # search space swept per workload row
  gpu_models: ["NVIDIA-A100-SXM4-80GB"]
  batch_sizes: [4, 8, 16, 32]
  total_gpus: [1, 2, 4, 8, 16]

# Input columns are named after the workload fields: llm_model, fine_tuning_method, gpu_model,
# tokens_per_sample and batch_size (per device), plus optional ones such as gpus_per_node and
# number_of_nodes. Other columns are copied to the output as they are. A CSV that names the
# workload fields differently needs a map from its column names to the field names:
# input:
#   columns:
#     model_name: llm_model
#     seq_len: tokens_per_sample
