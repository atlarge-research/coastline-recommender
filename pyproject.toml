[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[project]
name = "coastline-recommender"
version = "0.2.3"
description = "Coastline: a context-aware recommender system for fine-tuning LLMs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Radu Nicolae" },
    { name = "Daniele Lotito" },
    { name = "Alexandru Iosup" },
]
maintainers = [
    { name = "AtLarge Research", email = "info@atlarge-research.com" },
]
requires-python = ">=3.11,<3.14"
keywords = [
    "llm",
    "fine-tuning",
    "gpu",
    "datacenter",
    "recommender",
    "throughput",
    "energy-efficiency",
    "carbon",
    "sustainability",
    "mlops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    # The interactive REPL (`coastline recommend-job --interactive`) uses termios.
    "Operating System :: POSIX",
    # The <3.14 cap comes from ado-autoconf -> autogluon 1.5, which caps pyarrow<21.
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0,<3",      # <3: pandas 3 breaks xgboost 3.1.3 feature-name checks; ado-autoconf pins <3 too
    "pyarrow>=13.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "tqdm>=4.66.0",
    "cachetools>=5.3.0",
    # The `coastline-ui` dashboard.
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "jinja2>=3.1.0",
    # Throughput and power predictions.
    "kavier>=0.5.3,<0.6",
    # The default `feasibility: autoconf` OOM check.
    "ado-autoconf>=1.7,<2",
]

[project.optional-dependencies]
# Data-driven predictors. The wheel leaves out some model pickles (see wheel-exclude); retrain them
# with dev/trainer or point the predictors at your own (TABPFN_MODEL_PATH, ...).
ml = [
    "scikit-learn==1.7.2",   # tabpfn.pkl was written with scikit-learn 1.8.0, the other pickles with 1.7.2
    "xgboost==3.1.3",
    "lightgbm==4.6.0",
    "catboost==1.2.10",
    "torch>=2.0.0",
    "tabpfn==8.0.3",
]
# Empty: ado-autoconf is a core dependency. Kept so `coastline-recommender[autoconf]` still installs.
autoconf = []
# `coastline utils plot-trace`.
plot = ["matplotlib>=3.5"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "ruff==0.15.15",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML",
    "types-tqdm",
    "types-cachetools",
    "httpx2>=2.0.0",   # FastAPI TestClient
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
]

[project.scripts]
coastline = "coastline.cli:main"
coastline-ui = "coastline.ui:main"

[project.urls]
Homepage = "https://github.com/atlarge-research/coastline-recommender"
Repository = "https://github.com/atlarge-research/coastline-recommender"
Issues = "https://github.com/atlarge-research/coastline-recommender/issues"
Documentation = "https://atlarge-research.github.io/coastline-recommender/"

[tool.uv.build-backend]
# The distribution is `coastline-recommender`; the import package is `coastline`.
module-name = "coastline"
# The model pickles are in sdk/predictors/performance/data_driven/portfolio/. The wheel leaves out
# tabpfn, random_forest, gaussian_process, svr, knn and custom/; the repository and its Zenodo
# archive hold all of them.
wheel-exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.gitignore",
    "**/tests/**",
    "**/portfolio/tabpfn.pkl",
    "**/portfolio/random_forest.pkl",
    "**/portfolio/gaussian_process.pkl",
    "**/portfolio/svr.pkl",
    "**/portfolio/knn.pkl",
    "**/portfolio/custom/**",
]
# The sdist leaves out the two large pickles, as the wheel does.
source-exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/portfolio/tabpfn.pkl",
    "**/portfolio/random_forest.pkl",
    "**/portfolio/custom/**",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Long feature lists and label maps.
"src/coastline/sdk/predictors/performance/data_driven/**" = ["E501"]
"dev/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# dev/trainer/tests and dev/benchmark/tests import `trainer` and `benchmark` from dev/.
pythonpath = ["dev"]
# Tests that load several native ML backends (each bundles libomp) can crash one interpreter, so
# they are deselected by default. Run them one file per process:
# `uv run pytest -m ml_isolated -p no:cacheprovider FILE` (ci.yml loops over the files).
addopts = "-q -m 'not ml_isolated'"
markers = [
    "ml_isolated: native-ML predictor tests; run in their own pytest process",
]

[tool.coverage.run]
source = ["coastline"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
# The strict-clean packages; add one when it passes.
packages = ["coastline.sdk.models"]
exclude = ["tests/", "dev/"]
