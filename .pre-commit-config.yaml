# CI runs these hooks with `pre-commit run --all-files` (.github/workflows/ci.yml).
#
# Install once per clone:  uv run pre-commit install
# Run over everything:     uv run pre-commit run --all-files
#
# The ruff hooks use the ruff pinned in the pyproject dev group (uv.lock), so there is one ruff version.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # The bundled sample trace is excluded: tests read it back column for column.
      - id: end-of-file-fixer
        exclude: ^src/coastline/sdk/.*/data/.*$
      - id: trailing-whitespace
        exclude: ^src/coastline/sdk/.*/data/.*$
